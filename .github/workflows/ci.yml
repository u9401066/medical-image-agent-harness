name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run python scripts/check_compatibility.py
      - run: uv run ruff check .
      - run: uv run pytest --cov=medical_image_harness --cov-report=term-missing
      - run: uv build
      - run: uv run python scripts/check_distribution.py
