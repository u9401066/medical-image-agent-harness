[project]
name = "medical-image-agent-harness"
version = "0.1.0"
description = "Provider-neutral scientific harness for auditable agent-assisted medical image co-reading"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "u9401066" }]
keywords = ["medical-imaging", "agent", "codex", "copilot", "evaluation", "dicom"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "jsonschema>=4.23.0",
    "Pillow>=10.0.0",
    "PyYAML>=6.0",
    "structlog>=25.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
]

[project.scripts]
medical-image-harness = "medical_image_harness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medical_image_harness"]

[tool.hatch.build.targets.wheel.force-include]
".agents/skills/medical-image-reading" = "medical_image_harness/skills/medical-image-reading"
"schemas" = "medical_image_harness/schemas"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["--strict-markers", "--tb=short", "-ra"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.coverage.run]
source = ["medical_image_harness"]
branch = true

[tool.coverage.report]
fail_under = 80
